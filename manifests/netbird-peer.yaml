# ---------------------------------------------------------------------------
# NetBird PEER (client) — el lado del cluster de la malla WireGuard.
#
# Additivo y opt-in (deploy.sh: DEPLOY_NETBIRD_PEER=1). No toca ningún
# deployment existente: su trabajo es ser el par de la malla que anuncia las
# rutas del cluster (service CIDRs), para que clientes externos enrolados
# (p.ej. el container images/llm-router) alcancen occludra/vigil por su
# ClusterIP a través del mesh — sin sidecars en los gateways ni port-forwards.
#
# Prerrequisitos (una vez, 2 minutos — ver el encabezado de deploy.sh):
#   1. Controlplane: cuenta gratis en https://app.netbird.io (o el self-hosted
#      del companion cuando exista IdP). Crear una Setup Key (uso "reusable").
#   2. kubectl -n netbird create secret generic netbird-auth \
#        --from-literal=setup-key=<LA-KEY>
#      (los secretos NO viajan por git — mismo patrón que occludra-external-tokens)
#   3. En el dashboard de NetBird: Networking -> Routes -> agregar las rutas
#      del cluster (k0s: 10.96.0.0/12 service CIDR) con ESTE peer como router.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  labels: {app.kubernetes.io/part-of: mcp-eval-platform}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-peer-conf
  namespace: netbird
data:
  # El management cloud (o el self-hosted cuando exista):
  NETBIRD_MANAGEMENT_URL: "https://api.netbird.io"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-peer
  namespace: netbird
  labels: {app.kubernetes.io/name: netbird-peer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netbird-peer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbird-peer}
    spec:
      # En g1-1 (donde viven los gateways hoy): el forward socat los alcanza
      # por camino local. Los pods de otros nodos NO llegan a los pods de g1-1
      # (CNI dañado desde el NotReady del nodo) — ver historial del cluster.
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      nodeSelector:
        kubernetes.io/hostname: nodo-g1-1
      containers:
        - name: netbird
          image: netbirdio/netbird:0.82.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NETBIRD_MANAGEMENT_URL
              valueFrom: {configMapKeyRef: {name: netbird-peer-conf, key: NETBIRD_MANAGEMENT_URL}}
            - name: NB_SETUP_KEY
              valueFrom: {secretKeyRef: {name: netbird-auth, key: setup-key}}
          args: ["up", "--log-level", "info"]
          securityContext:
            capabilities: {add: ["NET_ADMIN"]}
            readOnlyRootFilesystem: false
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            exec: {command: ["/bin/sh", "-c", "netbird status | grep -q Connected"]}
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec: {command: ["/bin/sh", "-c", "netbird status | grep -q Connected"]}
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: dev-net-tun
          hostPath: {path: /dev/net/tun, type: CharDevice}
        - name: state
          emptyDir: {}
---
# Expone el gateway de occludra en la IP de malla del peer (100.66.x:8080):
# los clientes de la malla (llm-router, tu laptop) llegan por WireGuard sin
# kubectl ni port-forwards. La IP de malla cambia si el pod se recrea —
# leerla con: kubectl -n netbird exec deploy/netbird-peer -c netbird --
#   sh -c 'ip -4 addr show wt0 | grep -m1 inet'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-gw-forward
  namespace: netbird
  labels: {app.kubernetes.io/name: netbird-gw-forward}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netbird-gw-forward}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbird-gw-forward}
    spec:
      nodeSelector:
        kubernetes.io/hostname: nodo-g1-1
      containers:
        - name: gw-forward
          image: alpine/socat:latest
          args: ["-d","-d","TCP-LISTEN:8080,fork,reuseaddr","TCP:occludra-service.security-gateways.svc.cluster.local:8080"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
# security-gateways es default-deny: sin esto, nada del ns netbird llega a
# occludra (fue el ultimo blocker del E2E de la malla).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-netbird-peer-to-occludra
  namespace: security-gateways
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: occludra}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: netbird}
      ports: [{protocol: TCP, port: 8080}]
