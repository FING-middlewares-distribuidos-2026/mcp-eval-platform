# Chroma for a Vigil outside the cluster (VIGIL_REMOTE_URL, hack/pc-services):
#   https://<INGRESS_IP>/chroma/api/v2/...  ->  chroma-gateway (namespace chroma)
#
# chroma-gateway still checks every request: the reader token may only read
# collections and query them (manifests/chroma/gateway.yaml), anything else
# answers 401/403. Traefik strips /chroma, so the gateway sees the same raw
# URIs its rules match. Applied by deploy.sh with DEPLOY_INGRESS=1 and
# VIGIL_REMOTE_URL set.
#
# The PC reaches Traefik over the platform's ZeroTier network through a
# node's NodePort (fixed in manifests/traefik/values-mcp-eval.yaml), not
# through the ingress IP: that one is routed by the university's ZeroTier
# gateway, which goes down. Its Vigil verifies the ingress certificate
# anyway ([vectordb] ca_file + tls_server_name).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chroma-prefix
  namespace: chroma
spec:
  stripPrefix:
    prefixes: ["/chroma"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chroma
  namespace: chroma
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: chroma-chroma-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /chroma
            pathType: Prefix
            backend:
              service:
                name: chroma-gateway
                port:
                  number: 8080
---
# Chroma's policies let only Vigil pods reach the gateway; this adds exactly
# Traefik -> chroma-gateway on its port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-gateway-from-traefik
  namespace: chroma
  labels:
    app.kubernetes.io/part-of: chroma-distributed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chroma-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8080}
