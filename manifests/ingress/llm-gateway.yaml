# The LLM gateway for OpenCode clients outside the cluster:
#   https://<INGRESS_IP>/llm/v1  ->  Occludra (security-gateways)
# Anyone who points their OpenCode at it gets the same protection as the UI
# chat: secrets masked before they reach the model, and prompt injection
# screened by Vigil on the way out and on the way back (policy.injection).
#
# Traefik stamps X-Occludra-Client: external on every request, overwriting
# whatever the caller sent, so outsiders cannot pose as the UI chat. Occludra
# then requires a bearer token from the Secret occludra-external-tokens
# (hack/gitops/secrets.sh, never in git); no Secret means no access. Applied
# with DEPLOY_INGRESS=1.
#
# OpenCode config (opencode.json) on the client machine:
#   "provider": {"occludra": {"npm": "@ai-sdk/openai-compatible",
#     "options": {"baseURL": "https://<INGRESS_IP>/llm/v1", "apiKey": "<token>"},
#     "models": {"<LLM_MODEL>": {}}}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llm-gateway-prefix
  namespace: security-gateways
spec:
  stripPrefix:
    prefixes: ["/llm"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llm-gateway-client
  namespace: security-gateways
spec:
  headers:
    customRequestHeaders:
      X-Occludra-Client: external
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway
  namespace: security-gateways
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: security-gateways-llm-gateway-prefix@kubernetescrd,security-gateways-llm-gateway-client@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /llm
            pathType: Prefix
            backend:
              service:
                name: occludra-service
                port:
                  number: 8080
---
# Occludra's policies allow no ingress from outside the namespace except the
# UI chat; this adds exactly Traefik -> Occludra on the inference port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occludra-from-traefik
  namespace: security-gateways
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occludra
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
