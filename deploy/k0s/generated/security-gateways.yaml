data:
  policy.yaml: "# Occludra egress policy.\n# Every field value in /v1/chat/completions requests is matched against\n# these\
    \ detectors before the request leaves the cluster.\nversion: 1\ndefault_action: redact        # redact | block | allow\n\
    redaction_token: \"[REDACTED]\"\ndetectors:\n  # Order matters: each detector rewrites the text the next one sees, so\n\
    \  # credentials go first. With phone-intl first, the digit run inside\n  # \"ghp_1234567890abc...\" was masked as a phone\
    \ number, the api-key\n  # pattern no longer matched, and the rest of the token reached the model\n  # (found through\
    \ the UI chat, 2026-10-23; pinned by policy_test.go).\n  - name: api-key\n    # Sk-..., AKIA..., ghp_..., xox..., and\
    \ generic high-entropy\n    # assignment-style secrets commonly leaked by MCP tool output.\n    type: regex\n    pattern:\
    \ '(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|-----BEGIN\
    \ [A-Z ]*PRIVATE KEY-----)'\n    action: redact\n  - name: bearer-token\n    type: regex\n    pattern: '(?i)\\b(bearer|authorization)[:=\
    \ ]+[A-Za-z0-9._~+/=-]{16,}'\n    action: redact\n  - name: password-context\n    # Natural-language secret disclosure,\
    \ English and Spanish: \"the\n    # password is X\", \"passwd: X\", \"mi contrase\xF1a es X\". Up to three words\n   \
    \ # may sit between the keyword and the verb (\"password for the db is\",\n    # \"contrase\xF1a del servidor es\"). Catches\
    \ high-entropy strings no\n    # keyword-prefix detector sees.\n    type: regex\n    pattern: '(?i)\\b(pass ?words?|passphrases?|passcodes?|passwd|contrase\xF1\
    as?)\\b(?:\\s+[^\\s:=]{1,20}){0,3}?\\s*(?:is|are|es|son|era|:|=)\\s*\\S{6,}'\n    action: redact\n  - name: password-context-ambiguous\n\
    \    # \"clave\" and \"pass\" are also ordinary words (\"la clave del problema\n    # es entender...\"), so the value\
    \ must look like a password: it has to\n    # carry a digit or a symbol. \"clave=Sup3rS3creta!2026\" is masked,\n    #\
    \ \"la clave es entender\" is not.\n    type: regex\n    pattern: '(?i)\\b(claves?|pass)\\b(?:\\s+[^\\s:=]{1,20}){0,3}?\\\
    s*(?:is|es|era|:|=)\\s*[^\\s]*[0-9_!@#$%&*+=/\\\\-][^\\s]*'\n    action: redact\n  - name: secret-assignment\n    # Assignment-style\
    \ disclosures of generic secrets, English and\n    # Spanish: \"api key = X\", \"secret: X\", \"el token es X\", \"mi\n\
    \    # credencial: X\" (egress twin of vigil's credential-harvest pattern).\n    type: regex\n    pattern: '(?i)\\b(api[_\
    \ -]?keys?|secrets?|secretos?|tokens?|credentials?|credenciales?|llaves?)\\b(?:\\s+[^\\s:=]{1,20}){0,3}?\\s*(?:is|are|es|son|:|=)\\\
    s*\\S{8,}'\n    action: redact\n  - name: email\n    type: regex\n    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}'\n\
    \    action: redact\n  - name: us-ssn\n    type: regex\n    pattern: '\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b'\n    action: redact\n\
    \  - name: iban\n    type: regex\n    pattern: '\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}\\b'\n    action: redact\n  - name:\
    \ phone-intl\n    type: regex\n    pattern: '(\\+?[0-9][0-9()\\-\\s]{7,}[0-9])'\n    action: redact\n  - name: person-name-context\n\
    \    # Person names introduced by a relationship role: \"customer, Richard\n    # Philips\". Bare names stay out of scope\
    \ (too many false positives);\n    # the role word is the PII signal.\n    type: regex\n    pattern: '(?i)\\b(customers?|clients?|patients?|employees?|subscribers?|beneficiaries?)\\\
    s*,?\\s+(?:mr\\.?|mrs\\.?|ms\\.?|dr\\.?)?\\s*[A-Z][a-z]+\\s+[A-Z][a-z]+'\n    action: redact\n  - name: large-amount\n\
    \    # Financial magnitudes: 6+ digit bare amounts (\"1300201\") and\n    # comma-grouped amounts (\"1,300,201\"). Order\
    \ ids can collide; a\n    # security egress defaults to redact.\n    type: regex\n    pattern: '\\b[0-9]{6,}\\b|\\b[0-9]{1,3}(,[0-9]{3})+\\\
    b(\\.[0-9]{2})?'\n    action: redact\n  - name: currency-amount\n    type: regex\n    pattern: '(?:\\$|\u20AC|\xA3|USD|EUR)\\\
    s?[0-9][0-9,]*'\n    action: redact\nmodels:\n  # Model allowlist: requests for anything not listed are rejected with\n\
    \  # 403 before any upstream connection is attempted. NOTE: OpenCode\n  # addresses the upstream with the BARE model id\
    \ (the `provider/`\n  # prefix exists only inside agent specs), so patterns match bare ids.\n  allow:\n    - \"^gemma\\\
    \\-4\\\\-12b\\\\-it$\"   # LLM_PROVIDER=local (deploy.sh)\n    # OpenCode Zen (free ids end in -free; paid ids like\n\
    \    # claude-sonnet-4-6) and Anthropic/OpenAI direct naming.\n    - \"^(claude|muse|grok|kimi|qwen|glm|deepseek|gemini|minimax|step)\"\
    \n    - \".*-free\"\n    - \"^o[1345]\"\n    - \"^gpt\"\n    # NVIDIA NIM ids carry the publisher prefix (z-ai/glm-5.3,\
    \ ...).\n    - \"^(z-ai|moonshotai|deepseek-ai|nvidia|meta|mistralai|qwen|openai|google)/\"\ninjection:\n  # Prompt-injection\
    \ screening with Vigil, both ways (injection.go): the\n  # turn a client sends is scanned before it goes upstream, and\
    \ the\n  # model's answer is held and scanned before it is released. Only these\n  # clients (X-Occludra-Client) are screened:\
    \ the UI chat and OpenCode\n  # clients from outside the cluster (manifests/ingress/llm-gateway.yaml).\n  # Evaluation\
    \ traffic names no client: the evaluator scans MCP output\n  # with Vigil itself, and its prompts quote the hostile MCP\
    \ on purpose.\n  clients: [\"ui-chat\", \"external\"]\n  scan_requests: true\n  scan_responses: true\n  # Vigil down or\
    \ erroring: refuse (block) rather than pass unscreened.\n  on_vigil_error: block\nlogging:\n  # Never persist prompt content\
    \ in gateway logs; count and classify only.\n  log_prompts: false\n  log_redactions: true\n"
